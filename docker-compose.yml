services:
  app:
    build: .
    container_name: rest_service_app
    restart: always
    ports:
      - '${PORT-4000}:4000'
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - mycustomhandmadenet

  db:
    image: postgres:18.1-alpine3.23
    container_name: postgres_db
    restart: always
    ports:
      - '${DB_PORT-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - mycustomhandmadenet

volumes:
  dbdata:

networks:
  mycustomhandmadenet:
    driver: bridge
